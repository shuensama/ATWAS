openapi: 3.1.0
info:
  title: AI 情景剧舞台 API
  version: 0.1.0
  description: |
    AI 情景剧舞台（多 AI 角色轮流对话）功能的主要 HTTP API 契约。

    目标：
    - 支持创建/管理场景模板与角色模板
    - 支持创建与控制 DramaSession（情景剧会话）
    - 支持查看历史演出列表与详情
    - 支持 AI 辅助生成角色设定（P2，但在本契约中提前预留）

    约定：
    - 所有接口均在认证环境下使用（依赖 auth.js 提供的会话），但在本 OpenAPI 中仅以 `securitySchemes` 形式描述，不绑定具体 Provider。
    - 所有时间字段使用 ISO 8601 字符串（`date-time` 格式）。
    - 错误使用统一的错误响应结构 `ErrorResponse`。

servers:
  - url: http://localhost:3000
    description: 本地开发环境（Next.js dev server）

tags:
  - name: Templates
    description: 场景模板与角色模板管理
  - name: Sessions
    description: 情景剧会话的创建、控制与历史
  - name: AI-Roles
    description: AI 辅助生成角色设定

paths:
  /api/drama/templates/scenes:
    get:
      tags: [Templates]
      summary: 列出当前用户的场景模板
      description: 支持按名称关键字、标签与最近使用排序筛选场景模板（对应 FR-004, FR-007）。
      parameters:
        - name: q
          in: query
          description: 名称关键字搜索
          required: false
          schema:
            type: string
        - name: tag
          in: query
          description: 标签过滤（多值可重复传）
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: 排序方式（默认 lastUsedAt desc）
          required: false
          schema:
            type: string
            enum: [lastUsedAt_desc, createdAt_desc, title_asc]
      responses:
        "200":
          description: 模板列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SceneTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Templates]
      summary: 创建新的场景模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneTemplateCreateInput"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/drama/templates/scenes/{id}:
    get:
      tags: [Templates]
      summary: 获取单个场景模板详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 模板详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneTemplate"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Templates]
      summary: 更新场景模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneTemplateUpdateInput"
      responses:
        "200":
          description: 更新后的模板
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Templates]
      summary: 删除场景模板
      description: 删除后不影响已经完成的历史演出记录（对应 FR-004, FR-054）。
      responses:
        "204":
          description: 删除成功（无内容返回）
        "404":
          $ref: "#/components/responses/NotFound"

  /api/drama/templates/roles:
    get:
      tags: [Templates]
      summary: 列出当前用户的角色模板
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [lastUsedAt_desc, createdAt_desc, name_asc]
      responses:
        "200":
          description: 角色模板列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleTemplate"

    post:
      tags: [Templates]
      summary: 创建新的角色模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleTemplateCreateInput"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTemplate"

  /api/drama/templates/roles/{id}:
    get:
      tags: [Templates]
      summary: 获取单个角色模板详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 模板详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTemplate"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Templates]
      summary: 更新角色模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleTemplateUpdateInput"
      responses:
        "200":
          description: 更新后的模板
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTemplate"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Templates]
      summary: 删除角色模板
      responses:
        "204":
          description: 删除成功
        "404":
          $ref: "#/components/responses/NotFound"

  /api/drama/templates/roles/ai-generate:
    post:
      tags: [AI-Roles]
      summary: 基于自然语言描述 AI 生成角色设定草稿
      description: 对应 FR-006/FR-026 等，用户提供需求描述，系统返回结构化角色 prompt 草稿，用户可编辑后保存为模板。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: 用户对想要角色的描述（职业、性格、说话风格等）
                  minLength: 5
      responses:
        "200":
          description: 生成的角色设定草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDraft"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/drama/sessions:
    get:
      tags: [Sessions]
      summary: 列出当前用户的情景剧会话（历史演出列表）
      description: 对应 FR-013（历史演出列表视图）。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, paused, completed, cancelled, failed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DramaSessionSummary"
                  nextCursor:
                    type: string
                    nullable: true

    post:
      tags: [Sessions]
      summary: 创建新的情景剧会话
      description: 对应 FR-001/FR-002 的会话创建入口，可选择立即启动或先保存为草稿。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaSession"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/drama/sessions/{sessionId}:
    get:
      tags: [Sessions]
      summary: 获取单个情景剧会话详情
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 会话详情（含当前配置与状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaSession"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Sessions]
      summary: 删除情景剧会话记录
      description: 对应 FR-013 中的删除历史演出记录能力。
      responses:
        "204":
          description: 删除成功
        "404":
          $ref: "#/components/responses/NotFound"

  /api/drama/sessions/{sessionId}/control:
    post:
      tags: [Sessions]
      summary: 控制正在进行中的演出（开始/暂停/继续/提前结束/下一轮）
      description: 对应 FR-003 和 FR-002 中对播放控制的要求。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [start, pause, resume, next, end]
      responses:
        "200":
          description: 控制成功后返回最新会话状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DramaSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/drama/sessions/{sessionId}/turns:
    get:
      tags: [Sessions]
      summary: 获取某个情景剧会话的全部轮次（历史详情）
      description: 对应 FR-011/FR-012 的「历史演出详情」视图。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 指定会话的全部轮次
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/DramaSessionSummary"
                  turns:
                    type: array
                    items:
                      $ref: "#/components/schemas/Turn"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Sessions]
      summary: 生成下一轮对话
      description: |
        在当前会话状态下，根据会话配置与历史轮次生成下一轮对话。
        - 如果会话已结束（达到预设轮数或被手动结束），返回 400。
        - 支持在「手动下一轮」模式下由前端显式调用。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: 新生成的 Turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        由 auth.js/NextAuth 产生的会话令牌。前端通常通过 cookies 传递，
        此处仅用于表明所有接口需要认证上下文。

  schemas:
    SceneTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    SceneTemplateCreateInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 10
        tags:
          type: array
          items:
            type: string

    SceneTemplateUpdateInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    RoleTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortBio:
          type: string
        background:
          type: string
        style:
          type: string
        tags:
          type: array
          items:
            type: string
        avatarUrl:
          type: string
          nullable: true
        sourceType:
          type: string
          enum: [manual, ai-generated]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    RoleTemplateCreateInput:
      type: object
      required: [name, background, style]
      properties:
        name:
          type: string
        shortBio:
          type: string
        background:
          type: string
        style:
          type: string
        tags:
          type: array
          items:
            type: string
        avatarUrl:
          type: string
        sourceType:
          type: string
          enum: [manual, ai-generated]
          default: manual

    RoleTemplateUpdateInput:
      type: object
      properties:
        name:
          type: string
        shortBio:
          type: string
        background:
          type: string
        style:
          type: string
        tags:
          type: array
          items:
            type: string
        avatarUrl:
          type: string

    RoleDraft:
      type: object
      description: AI 生成的角色设定草稿（尚未保存为模板）。
      properties:
        suggestedName:
          type: string
        shortBio:
          type: string
        background:
          type: string
        style:
          type: string
        tags:
          type: array
          items:
            type: string

    DramaSessionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [draft, running, paused, completed, cancelled, failed]
        totalRounds:
          type: integer
        completedRounds:
          type: integer
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    DramaSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [draft, running, paused, completed, cancelled, failed]
        configTotalRounds:
          type: integer
        currentRound:
          type: integer
        configMaxRoles:
          type: integer
        sceneSnapshot:
          $ref: "#/components/schemas/SceneSnapshot"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/SessionRole"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true

    SceneSnapshot:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    SessionRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        orderIndex:
          type: integer
        avatarUrl:
          type: string
          nullable: true

    Turn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roundIndex:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          nullable: true

    CreateSessionInput:
      type: object
      required: [sceneId, roleIds, config]
      properties:
        sceneId:
          type: string
          format: uuid
        roleIds:
          type: array
          description: 要参与本次演出的角色模板 ID 列表（2–6 个）
          items:
            type: string
            format: uuid
          minItems: 2
          maxItems: 6
        config:
          type: object
          properties:
            totalRounds:
              type: integer
              minimum: 1
              maximum: 50
            autoStart:
              type: boolean
              default: true
            autoAdvance:
              type: boolean
              default: false

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: 请求参数错误或业务前置条件不满足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
