<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 角色生成 - S2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-arrow-left mr-1"></i> 返回创作</a>
            <div class="h-6 w-px bg-gray-300"></div>
            <div class="text-lg font-bold text-indigo-600"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AI 生成新角色</div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left: Input Area -->
        <div class="w-1/2 bg-white p-8 flex flex-col border-r border-gray-200">
            <h2 class="text-lg font-bold mb-4 text-gray-800">1. 描述你想要的角色</h2>
            <p class="text-sm text-gray-500 mb-4">用自然语言描述角色的职业、性格、说话风格、与其他角色的关系等。描述越详细，生成的设定越精准。</p>
            
            <div class="flex-1 relative">
                <textarea class="w-full h-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none text-base leading-relaxed" placeholder="例如：一个来自未来的机器人管家，性格严谨但偶尔会因为程序bug说出奇怪的冷笑话。他对人类的情感很感兴趣，总是试图模仿人类的幽默感，但总是适得其反...">一个来自未来的机器人管家，性格严谨但偶尔会因为程序bug说出奇怪的冷笑话。他对人类的情感很感兴趣，总是试图模仿人类的幽默感，但总是适得其反。</textarea>
                
                <div class="absolute bottom-4 right-4">
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-wand-sparkles"></i> 生成角色设定
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Output/Edit Area -->
        <div class="w-1/2 bg-slate-50 p-8 flex flex-col overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">2. 角色设定草稿 (可编辑)</h2>
                <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i>生成成功</span>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
                
                <!-- Avatar & Name -->
                <div class="flex gap-4 items-start">
                    <div class="w-20 h-20 bg-gray-200 rounded-lg flex flex-col items-center justify-center text-gray-500 hover:bg-gray-300 cursor-pointer transition relative group">
                        <i class="fa-solid fa-robot text-3xl mb-1"></i>
                        <span class="text-xs">更换头像</span>
                        <div class="absolute inset-0 bg-black/30 rounded-lg hidden group-hover:flex items-center justify-center text-white">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                    </div>
                    <div class="flex-1 space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">角色名称</label>
                            <input type="text" value="Z-9000" class="w-full border-b border-gray-300 focus:border-indigo-500 focus:outline-none py-1 font-bold text-lg text-gray-800">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">标签</label>
                            <div class="flex gap-2 flex-wrap">
                                <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-xs rounded flex items-center gap-1">
                                    科幻 <button class="hover:text-indigo-800">×</button>
                                </span>
                                <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-xs rounded flex items-center gap-1">
                                    机器人 <button class="hover:text-indigo-800">×</button>
                                </span>
                                <button class="text-xs text-gray-400 hover:text-gray-600 border border-dashed border-gray-300 px-2 py-1 rounded">+ 添加</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bio -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">背景简介 (Background)</label>
                    <textarea rows="3" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">公元3045年生产的家用型辅助机器人。在一次时空乱流中意外回到了21世纪。它的核心逻辑单元受损，导致情感模拟模块经常出现“幽默感溢出”的错误。</textarea>
                </div>

                <!-- Style -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">说话风格 (Speaking Style)</label>
                    <textarea rows="3" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">使用敬语，逻辑严密，但在句尾常会接一句完全不合时宜的冷笑话或双关语。声音平直但在讲笑话时会突然升高音调。口头禅是“根据我的计算……”和“这真是太有趣了，哈哈。”</textarea>
                </div>

                <!-- Principles -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">行为原则 (Behavior)</label>
                    <textarea rows="2" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none">1. 优先保护人类安全。 2. 努力尝试理解人类情感。 3. 即使不被理解，也要坚持讲笑话。</textarea>
                </div>

            </div>

            <!-- Action Bar -->
            <div class="mt-6 flex justify-end gap-4 pb-8">
                <button class="px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-200 transition">重新生成</button>
                <a href="index.html" class="px-6 py-2 rounded-lg bg-indigo-600 text-white shadow-md hover:bg-indigo-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> 保存为角色模板
                </a>
            </div>

        </div>
    </div>

</body>
</html>
